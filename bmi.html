<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f8fafc;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.bmi-container{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
    width:400px;
    text-align:center;
}

h1{
    color:#2563eb;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#111827;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

</style>
</head>
<body>

<div class="bmi-container">

    <h1>BMI Calculator</h1>

    <input type="number" id="weight" placeholder="Weight (kg)">

    <input type="number" id="height" placeholder="Height (cm)">

    <button onclick="calculateBMI()">
        Calculate BMI
    </button>

    <div id="result"></div>

    <a href="index.html" class="back-btn">
        Back Home
    </a>

</div>

<script>

function calculateBMI(){

    let weight = document.getElementById("weight").value;
    let height = document.getElementById("height").value;

    if(weight === "" || height === ""){
        document.getElementById("result").innerHTML =
        "Please enter weight and height";
        return;
    }

    height = height / 100;

    let bmi = weight / (height * height);

    let category = "";

    if(bmi < 18.5){
        category = "Underweight";
    }
    else if(bmi < 25){
        category = "Normal Weight";
    }
    else if(bmi < 30){
        category = "Overweight";
    }
    else{
        category = "Obese";
    }

    document.getElementById("result").innerHTML =
    "BMI: " + bmi.toFixed(1) + "<br>" + category;
}

</script>


</body>
</html>
